openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 1.0.0
  description: REST API for machine breakdown and downtime monitoring
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: machines
  - name: breakdowns
  - name: maintenance
  - name: dashboard
  - name: history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with a username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/ApiError"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out the current user
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get the authenticated user's profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          $ref: "#/components/responses/ApiError"
  /machines:
    get:
      operationId: listMachines
      tags: [machines]
      summary: List machines
      parameters:
        - $ref: "#/components/parameters/LineQuery"
        - $ref: "#/components/parameters/MachineStatusQuery"
      responses:
        "200":
          description: Machines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineListResponse"
        "401":
          $ref: "#/components/responses/ApiError"
    post:
      operationId: createMachine
      tags: [machines]
      summary: Register a machine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineInput"
      responses:
        "201":
          description: Machine created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineResponse"
        "409":
          $ref: "#/components/responses/ApiError"
  /machines/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getMachine
      tags: [machines]
      summary: Get a machine
      responses:
        "200":
          description: Machine
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineResponse"
        "404":
          $ref: "#/components/responses/ApiError"
    put:
      operationId: updateMachine
      tags: [machines]
      summary: Update a machine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MachineUpdate"
      responses:
        "200":
          description: Machine updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MachineResponse"
        "409":
          $ref: "#/components/responses/ApiError"
    delete:
      operationId: deleteMachine
      tags: [machines]
      summary: Delete a machine without history or mark it inactive
      responses:
        "200":
          description: Machine deleted or deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionResponse"
  /breakdowns:
    get:
      operationId: listBreakdowns
      tags: [breakdowns]
      summary: List breakdowns
      parameters:
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/LineQuery"
        - $ref: "#/components/parameters/MachineIdQuery"
        - $ref: "#/components/parameters/BreakdownStatusQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Breakdown list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownListResponse"
    post:
      operationId: createBreakdown
      tags: [breakdowns]
      summary: Record a machine breakdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakdownInput"
      responses:
        "201":
          description: Breakdown created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownResponse"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
  /breakdowns/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      operationId: getBreakdown
      tags: [breakdowns]
      summary: Get breakdown detail and maintenance actions
      responses:
        "200":
          description: Breakdown detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownDetailResponse"
        "404":
          $ref: "#/components/responses/ApiError"
    put:
      operationId: updateBreakdown
      tags: [breakdowns]
      summary: Update an open breakdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BreakdownUpdate"
      responses:
        "200":
          description: Breakdown updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownResponse"
        "409":
          $ref: "#/components/responses/ApiError"
  /breakdowns/{id}/maintenance:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: addMaintenance
      tags: [maintenance]
      summary: Add a maintenance action to an open breakdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceInput"
      responses:
        "201":
          description: Maintenance action recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceResponse"
        "409":
          $ref: "#/components/responses/ApiError"
  /maintenance/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    put:
      operationId: updateMaintenance
      tags: [maintenance]
      summary: Update a maintenance action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaintenanceInput"
      responses:
        "200":
          description: Maintenance action updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaintenanceResponse"
        "409":
          $ref: "#/components/responses/ApiError"
  /breakdowns/{id}/complete:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    post:
      operationId: completeBreakdown
      tags: [breakdowns]
      summary: Complete a breakdown and calculate downtime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteBreakdownInput"
      responses:
        "200":
          description: Breakdown completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownResponse"
        "409":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard summary
      parameters:
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/LineQuery"
        - $ref: "#/components/parameters/MachineIdQuery"
      responses:
        "200":
          description: Summary metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryResponse"
  /dashboard/downtime:
    get:
      operationId: getDashboardDowntime
      tags: [dashboard]
      summary: Downtime grouped by machine for a period
      parameters:
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/LineQuery"
        - $ref: "#/components/parameters/MachineIdQuery"
      responses:
        "200":
          description: Downtime series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardDowntimeResponse"
  /dashboard/frequency:
    get:
      operationId: getDashboardFrequency
      tags: [dashboard]
      summary: Breakdown frequency grouped by machine
      parameters:
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/LineQuery"
        - $ref: "#/components/parameters/MachineIdQuery"
      responses:
        "200":
          description: Frequency series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardFrequencyResponse"
  /history:
    get:
      operationId: getHistory
      tags: [history]
      summary: Filtered breakdown and maintenance history
      parameters:
        - $ref: "#/components/parameters/StartDateQuery"
        - $ref: "#/components/parameters/EndDateQuery"
        - $ref: "#/components/parameters/LineQuery"
        - $ref: "#/components/parameters/MachineIdQuery"
        - $ref: "#/components/parameters/BreakdownStatusQuery"
        - $ref: "#/components/parameters/PageQuery"
        - $ref: "#/components/parameters/LimitQuery"
      responses:
        "200":
          description: Filtered breakdown history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakdownListResponse"
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    StartDateQuery:
      name: start_date
      in: query
      schema:
        type: string
        format: date
    EndDateQuery:
      name: end_date
      in: query
      schema:
        type: string
        format: date
    LineQuery:
      name: line
      in: query
      schema:
        type: string
    MachineIdQuery:
      name: machine_id
      in: query
      schema:
        type: integer
        minimum: 1
    MachineStatusQuery:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/MachineStatus"
    BreakdownStatusQuery:
      name: status
      in: query
      schema:
        $ref: "#/components/schemas/BreakdownStatus"
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ApiError:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: string
      required: [success, message]
    ActionResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          additionalProperties: true
        message:
          type: string
      required: [success, data, message]
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        role:
          type: string
      required: [id, username, name, role]
    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/User"
      required: [success, data]
    LoginInput:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 50
        password:
          type: string
          minLength: 1
          maxLength: 200
      required: [username, password]
    LoginResult:
      type: object
      properties:
        success:
          type: boolean
          const: true
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
        message:
          type: string
      required: [success, token, user, message]
    MachineStatus:
      type: string
      enum: [active, down, inactive]
    Machine:
      type: object
      properties:
        id:
          type: integer
        machine_code:
          type: string
        name:
          type: string
        line:
          type: string
        status:
          $ref: "#/components/schemas/MachineStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, machine_code, name, line, status, created_at, updated_at]
    MachineInput:
      type: object
      properties:
        machine_code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 100
        line:
          type: string
          minLength: 1
          maxLength: 50
      required: [machine_code, name, line]
    MachineUpdate:
      type: object
      properties:
        machine_code:
          type: string
          minLength: 1
          maxLength: 30
        name:
          type: string
          minLength: 1
          maxLength: 100
        line:
          type: string
          minLength: 1
          maxLength: 50
        status:
          $ref: "#/components/schemas/MachineStatus"
    MachineResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/Machine"
        message:
          type: string
      required: [success, data]
    MachineListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Machine"
      required: [success, data]
    BreakdownStatus:
      type: string
      enum: [open, completed]
    Breakdown:
      type: object
      properties:
        id:
          type: integer
        machine_id:
          type: integer
        machine_code:
          type: string
        machine_name:
          type: string
        line:
          type: string
        problem:
          type: string
        cause:
          type: string
        started_at:
          type: string
          format: date-time
        completed_at:
          type: [string, "null"]
          format: date-time
        downtime_minutes:
          type: [integer, "null"]
        status:
          $ref: "#/components/schemas/BreakdownStatus"
        created_by:
          type: integer
        reporter_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        maintenance_count:
          type: integer
      required: [id, machine_id, machine_code, machine_name, line, problem, cause, started_at, completed_at, downtime_minutes, status, created_by, reporter_name, created_at, updated_at, maintenance_count]
    BreakdownInput:
      type: object
      properties:
        machine_id:
          type: integer
          minimum: 1
        problem:
          type: string
          minLength: 1
          maxLength: 255
        cause:
          type: string
          minLength: 1
          maxLength: 255
        started_at:
          type: string
          format: date-time
      required: [machine_id, problem, cause, started_at]
    BreakdownUpdate:
      type: object
      properties:
        machine_id:
          type: integer
          minimum: 1
        problem:
          type: string
          minLength: 1
          maxLength: 255
        cause:
          type: string
          minLength: 1
          maxLength: 255
        started_at:
          type: string
          format: date-time
    BreakdownResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/Breakdown"
        message:
          type: string
      required: [success, data]
    Maintenance:
      type: object
      properties:
        id:
          type: integer
        breakdown_id:
          type: integer
        action:
          type: string
        component_replaced:
          type: [string, "null"]
        notes:
          type: [string, "null"]
        user_id:
          type: integer
        user_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, breakdown_id, action, component_replaced, notes, user_id, user_name, created_at, updated_at]
    MaintenanceInput:
      type: object
      properties:
        action:
          type: string
          minLength: 1
          maxLength: 255
        component_replaced:
          type: [string, "null"]
          maxLength: 150
        notes:
          type: [string, "null"]
      required: [action]
    MaintenanceResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/Maintenance"
        message:
          type: string
      required: [success, data]
    BreakdownDetail:
      allOf:
        - $ref: "#/components/schemas/Breakdown"
        - type: object
          properties:
            maintenance:
              type: array
              items:
                $ref: "#/components/schemas/Maintenance"
          required: [maintenance]
    BreakdownDetailResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/BreakdownDetail"
      required: [success, data]
    CompleteBreakdownInput:
      type: object
      properties:
        completed_at:
          type: string
          format: date-time
      required: [completed_at]
    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer
      required: [page, limit, total, total_pages]
    BreakdownListResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Breakdown"
        pagination:
          $ref: "#/components/schemas/Pagination"
      required: [success, data, pagination]
    DashboardSummary:
      type: object
      properties:
        total_breakdowns:
          type: integer
        total_downtime:
          type: integer
        open_breakdowns:
          type: integer
        active_machines:
          type: integer
        machines_down:
          type: integer
        machine_most_broken:
          type: [string, "null"]
        downtime_change_percent:
          type: number
      required: [total_breakdowns, total_downtime, open_breakdowns, active_machines, machines_down, machine_most_broken, downtime_change_percent]
    DashboardSummaryResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: "#/components/schemas/DashboardSummary"
      required: [success, data]
    MachineAggregate:
      type: object
      properties:
        machine_id:
          type: integer
        machine_code:
          type: string
        machine_name:
          type: string
        line:
          type: string
        total_downtime:
          type: integer
        breakdown_count:
          type: integer
      required: [machine_id, machine_code, machine_name, line, total_downtime, breakdown_count]
    MachineAggregateResponse:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/MachineAggregate"
      required: [success, data]
    DashboardDowntimeResponse:
      allOf:
        - $ref: "#/components/schemas/MachineAggregateResponse"
    DashboardFrequencyResponse:
      allOf:
        - $ref: "#/components/schemas/MachineAggregateResponse"