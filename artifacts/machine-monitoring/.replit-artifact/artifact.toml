kind = "web"
previewPath = "/machine-monitoring/"
title = "Monitoring Kerusakan Mesin"
description = "Sistem untuk petugas maintenance mencatat kerusakan mesin, merekam perbaikan, menghitung downtime, dan memantau riwayat melalui dashboard."
version = "1.0.0"
id = "artifacts/machine-monitoring"
router = "path"

[[services]]
name = "web"
paths = ["/machine-monitoring/"]
localPort = 22701

[services.development]
run = "pnpm --filter @workspace/machine-monitoring run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/machine-monitoring", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/machine-monitoring", "run", "start"]

[services.production.run.env]
PORT = "22701"
NODE_ENV = "production"

[services.production.health.startup]
path = "/machine-monitoring/api/healthz"

[services.env]
PORT = "22701"
BASE_PATH = "/machine-monitoring/"