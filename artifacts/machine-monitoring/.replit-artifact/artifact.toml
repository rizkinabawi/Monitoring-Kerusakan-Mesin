kind = "web"
previewPath = "/"
title = "Monitoring Kerusakan Mesin"
description = "Factory operations console for staff to monitor machines, record breakdowns and maintenance actions, track downtime, and review production history."
version = "1.0.0"
id = "artifacts/machine-monitoring"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22701

[services.development]
run = "pnpm --filter @workspace/machine-monitoring run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/machine-monitoring", "run", "build" ]
serve = "static"
publicDir = "artifacts/machine-monitoring/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22701"
BASE_PATH = "/"
